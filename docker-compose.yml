services:
  pht:
    build: .
    ports: ["8765:8765"]
    env_file: [paper_annotation/.env]      # OPENAI_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY
    environment:
      # CORS_ORIGINS: "https://your-domain.example"   # restrict when exposed publicly
      EMBEDDING_MODEL_NAME: BAAI/bge-large-en-v1.5
    volumes:
      - ./papers:/app/papers
      - ./paper_annotation/data:/app/paper_annotation/data
